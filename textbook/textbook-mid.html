<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Terra Nova Textbook · MID</title>
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/layout.css" />
<link rel="stylesheet" href="styles/layout-mid.css" />
<link rel="stylesheet" href="styles/print.css" />
</head>
<body>

<template id="tpl-passage-mid">
  <article class="passage" data-slot="root">

    <!-- Page 1 — Passage (Junior layout: side rail + cloud header) -->
    <section class="page page-1 junior" data-page="1">
      <header class="page-head">
        <span class="section-label">PASSAGE</span>
        <span class="chapter-tag" data-slot="chapter-tag"></span>
      </header>

      <!-- Junior side rail: cloud + big number + Think + mascot + word-count -->
      <aside class="jr-rail" aria-hidden="true">
        <svg class="jr-cloud" viewBox="0 0 120 70" preserveAspectRatio="xMidYMid meet">
          <path d="M14 52 Q4 50 6 38 Q8 24 24 26 Q30 12 48 16 Q62 6 78 18 Q98 14 104 32 Q118 36 112 52 Z"
                fill="var(--jr-cloud-fill)" stroke="var(--jr-cloud-stroke)" stroke-width="2"
                stroke-linejoin="round" />
        </svg>
        <div class="jr-num" data-slot="jr-num">1</div>
        <div class="jr-think">
          <div class="jr-think-label">Think!</div>
          <div class="jr-think-q" data-slot="jr-think-q"></div>
        </div>
        <div class="jr-mascot">
          <svg viewBox="0 0 80 90" preserveAspectRatio="xMidYMid meet">
            <!-- arms -->
            <path d="M14 48 q-8 -2 -10 -12" stroke="var(--jr-mascot-line)" stroke-width="2.2"
                  stroke-linecap="round" fill="none"/>
            <path d="M66 48 q8 -2 10 -12" stroke="var(--jr-mascot-line)" stroke-width="2.2"
                  stroke-linecap="round" fill="none"/>
            <!-- body (book) -->
            <rect x="12" y="22" width="56" height="48" rx="6"
                  fill="var(--jr-mascot-body)" stroke="var(--jr-mascot-line)" stroke-width="2"/>
            <!-- book spine line -->
            <line x1="40" y1="26" x2="40" y2="66" stroke="var(--jr-mascot-line)"
                  stroke-width="1.4" stroke-dasharray="2 2"/>
            <!-- face -->
            <circle cx="28" cy="42" r="2.4" fill="var(--jr-mascot-line)"/>
            <circle cx="52" cy="42" r="2.4" fill="var(--jr-mascot-line)"/>
            <path d="M30 52 q10 6 20 0" stroke="var(--jr-mascot-line)" stroke-width="2"
                  fill="none" stroke-linecap="round"/>
            <!-- legs -->
            <path d="M24 70 v10 q0 4 4 4" stroke="var(--jr-mascot-line)" stroke-width="2.2"
                  fill="none" stroke-linecap="round"/>
            <path d="M56 70 v10 q0 4 -4 4" stroke="var(--jr-mascot-line)" stroke-width="2.2"
                  fill="none" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="jr-wordcount" data-slot="jr-wordcount"></div>
      </aside>

      <div class="page-body jr-body">
        <div class="p1-meta">
          <span class="chip" data-slot="subject"></span>
          <span class="chip part" data-slot="part"></span>
          <span class="chip level" data-slot="lexile"></span>
          <span class="chip level" data-slot="ar"></span>
          <span class="chip grade" data-slot="grade"></span>
        </div>
        <h1 class="p1-title" data-slot="title"></h1>
        <p class="p1-subtitle" data-slot="subtitle"></p>
        <div class="p1-body" data-slot="body"></div>
        <figure class="p1-illustration">
          <img data-slot="illustration" alt="" />
        </figure>
        <figcaption class="p1-caption" data-slot="illustration-caption"></figcaption>

        <!-- Junior Words pocket dictionary -->
        <aside class="jr-words" data-slot="jr-words-wrap">
          <div class="jr-words-head">
            <svg class="jr-words-icon" viewBox="0 0 40 40" aria-hidden="true">
              <ellipse cx="20" cy="34" rx="14" ry="3" fill="var(--jr-mint-deep)" opacity="0.18"/>
              <path d="M8 30 q0 -16 12 -22 q12 6 12 22 z"
                    fill="var(--jr-mint)" stroke="var(--jr-mint-deep)" stroke-width="1.4"/>
              <path d="M20 8 v22" stroke="var(--jr-mint-deep)" stroke-width="1.2"/>
              <path d="M14 14 q6 4 12 0" stroke="var(--jr-mint-deep)" stroke-width="1" fill="none"/>
              <path d="M12 20 q8 4 16 0" stroke="var(--jr-mint-deep)" stroke-width="1" fill="none"/>
            </svg>
            <span class="jr-words-title">Words</span>
          </div>
          <div class="jr-words-grid" data-slot="jr-words"></div>
        </aside>
      </div>
      <footer class="page-foot">
        <span class="foot-day"></span>
        <span class="page-num" data-slot="page-num-1"></span>
        <span class="brand">TERRA<span class="brand-dot">·</span>NOVA</span>
      </footer>
    </section>

    <!-- Page 2 — School-style Practice + Tieback (emoji visual aid) -->
    <section class="page page-2 mid-p2" data-page="2">
      <header class="page-head">
        <span class="section-label">PRACTICE</span>
        <span class="chapter-tag" data-slot="chapter-tag-2"></span>
      </header>
      <div class="page-body">
        <div class="mid-questions" data-slot="questions"></div>
        <aside class="mid-tieback">
          <div class="unit-label" data-slot="tieback-unit"></div>
          <div class="body-ko" data-slot="tieback-body"></div>
          <div class="tags" data-slot="tieback-tags"></div>
          <div class="visual-aid-wrap" data-slot="tieback-visual"></div>
        </aside>
      </div>
      <footer class="page-foot">
        <span class="foot-day"></span>
        <span class="page-num" data-slot="page-num-2"></span>
        <span class="brand">TERRA<span class="brand-dot">·</span>NOVA</span>
      </footer>
    </section>

    <!-- Page 3 — Syntax Breakdown (same as standard) + small Reading Strategy strip -->
    <section class="page page-3" data-page="3">
      <header class="page-head">
        <span class="section-label">SYNTAX</span>
        <span class="chapter-tag" data-slot="chapter-tag-3"></span>
      </header>
      <div class="page-body">
        <div class="p3-legend">
          <span class="legend-item"><span class="role-badge" style="background: var(--role-S); color: var(--role-S-ink);">S</span>주어</span>
          <span class="legend-item"><span class="role-badge" style="background: var(--role-V); color: var(--role-V-ink);">V</span>동사</span>
          <span class="legend-item"><span class="role-badge" style="background: var(--role-O); color: var(--role-O-ink);">O</span>목적어</span>
          <span class="legend-item"><span class="role-badge" style="background: var(--role-C); color: var(--role-C-ink);">C</span>보어</span>
          <span class="legend-item"><span class="role-badge" style="background: var(--role-M); color: var(--role-M-ink);">M</span>수식어</span>
          <span class="legend-item"><span class="role-badge" style="background: var(--role-CONJ); color: var(--role-CONJ-ink);">접</span>접속사</span>
          <span class="legend-item"><span class="role-badge" style="background: var(--role-REL); color: var(--role-REL-ink);">관</span>관계사</span>
        </div>
        <div class="p3-sentences" data-slot="sentences"></div>
        <div class="p3-translation">
          <h4>📖 우리말 해석</h4>
          <div class="body" data-slot="translation"></div>
        </div>
      </div>
      <footer class="page-foot">
        <span class="foot-day"></span>
        <span class="page-num" data-slot="page-num-3"></span>
        <span class="brand">TERRA<span class="brand-dot">·</span>NOVA</span>
      </footer>
    </section>

    <!-- Page 4 — Vocab Mix (collocation + word_root + word) -->
    <section class="page page-4 mid-p4" data-page="4">
      <header class="page-head">
        <span class="section-label">VOCAB</span>
        <span class="chapter-tag" data-slot="chapter-tag-4"></span>
      </header>
      <div class="page-body">
        <div class="mid-vocab" data-slot="vocab"></div>
      </div>
      <footer class="page-foot">
        <span class="foot-day"></span>
        <span class="page-num" data-slot="page-num-4"></span>
        <span class="brand">TERRA<span class="brand-dot">·</span>NOVA</span>
      </footer>
    </section>

  </article>
</template>

<main id="stage"></main>

<script type="module" src="scripts/render-mid.js"></script>
</body>
</html>
