# Terra Nova · Supabase 프로젝트 설정
# 자세한 옵션: https://supabase.com/docs/guides/cli/config

project_id = "betkydmxrnlhgmnprbca"

[functions.naver-oauth]
verify_jwt = false

[functions.portone-webhook]
verify_jwt = false

[functions.renew-subscriptions]
verify_jwt = false

[functions.send-email]
verify_jwt = false

# create-order: 사용자 JWT 검증 필수 (서버사이드 가격 검증)
# verify_jwt = true (default; 명시적으로 적어둠)
[functions.create-order]
verify_jwt = true

# dispatch-monthly-pdf: cron + admin 호출. 자체 Authorization 검증 (INTERNAL_EMAIL_SECRET or admin JWT).
[functions.dispatch-monthly-pdf]
verify_jwt = false

# send-sample: 비로그인 방문자의 무료 샘플 신청 폼에서 호출 → JWT 없음. 자체 검증(레이트리밋·레벨 게이트).
[functions.send-sample]
verify_jwt = false

# dispatch-order-pdf: portone-webhook(서버)에서 호출. 자체 INTERNAL_EMAIL_SECRET 검증.
[functions.dispatch-order-pdf]
verify_jwt = false
