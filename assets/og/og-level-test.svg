<?xml version="1.0" encoding="UTF-8"?>
<!-- OG cover for level_test.html (1200×630) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Terra Nova level test">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="60%">
      <stop offset="0%"  stop-color="rgba(0,255,163,.18)"/>
      <stop offset="60%" stop-color="rgba(0,255,163,.04)"/>
      <stop offset="100%" stop-color="rgba(0,255,163,0)"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0A0A0A"/>
  <rect width="1200" height="630" fill="url(#halo)"/>

  <g fill="#00FFA3" opacity=".22">
    <circle cx="180" cy="120" r="1.2"/>
    <circle cx="980" cy="100" r="1.5"/>
  </g>

  <text x="600" y="120" text-anchor="middle"
        font-family="'Space Grotesk','Arial',sans-serif" font-weight="700"
        font-size="14" letter-spacing="7" fill="#00FFA3">TERRA NOVA · LEVEL TEST</text>

  <!-- 8 ladder bars -->
  <g transform="translate(600,260)">
    <rect x="-200" y="42" width="36" height="22" fill="#00FFA3" opacity=".25" rx="2"/>
    <rect x="-150" y="32" width="36" height="32" fill="#00FFA3" opacity=".35" rx="2"/>
    <rect x="-100" y="20" width="36" height="44" fill="#00FFA3" opacity=".45" rx="2"/>
    <rect x="-50" y="6" width="36" height="58" fill="#00FFA3" opacity=".6" rx="2"/>
    <rect x="0" y="-8" width="36" height="72" fill="#00FFA3" opacity=".75" rx="2"/>
    <rect x="50" y="-22" width="36" height="86" fill="#00FFA3" opacity=".88" rx="2"/>
    <rect x="100" y="-36" width="36" height="100" fill="#00FFA3" rx="2"/>
    <rect x="150" y="-50" width="36" height="114" fill="#00FFA3" rx="2"/>
  </g>

  <text x="600" y="406" text-anchor="middle"
        font-family="'Pretendard','Noto Sans KR','Arial',sans-serif" font-weight="800"
        font-size="34" fill="#F0F0F0">3분 무료 진단으로 내 레벨 찾기</text>

  <line x1="540" y1="446" x2="660" y2="446" stroke="#00FFA3" stroke-width="2"/>

  <text x="600" y="500" text-anchor="middle"
        font-family="'Space Grotesk','Arial',sans-serif" font-weight="500"
        font-size="18" letter-spacing="6" fill="rgba(240,240,240,.5)">terra-nova.kr/level_test</text>
</svg>
