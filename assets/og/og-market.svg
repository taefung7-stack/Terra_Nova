<?xml version="1.0" encoding="UTF-8"?>
<!-- OG cover for market.html (1200×630) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Terra Nova 마켓 OG 커버">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0B0A2E"/>
      <stop offset="55%"  stop-color="#0A0A14"/>
      <stop offset="100%" stop-color="#050512"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="bookA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="bookB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="bookC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="50%" r="55%">
      <stop offset="0%"  stop-color="rgba(251,191,36,.14)"/>
      <stop offset="100%" stop-color="rgba(251,191,36,0)"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g fill="#fff" opacity=".4">
    <circle cx="120" cy="80" r="1.2"/><circle cx="600" cy="40" r="1.4"/>
    <circle cx="1080" cy="60" r="1.4"/><circle cx="200" cy="560" r="1.2"/>
    <circle cx="1000" cy="540" r="1.4"/>
  </g>

  <!-- Stack of books on left -->
  <g transform="translate(140,180)">
    <rect x="0" y="270" width="280" height="48" rx="4" fill="url(#bookA)"/>
    <text x="20" y="302"
          font-family="'Bebas Neue','Arial',sans-serif" font-weight="700"
          font-size="22" letter-spacing="2" fill="#fff">VOCAB · MARS</text>
    <rect x="20" y="216" width="260" height="48" rx="4" fill="url(#bookB)"/>
    <text x="40" y="248"
          font-family="'Bebas Neue','Arial',sans-serif" font-weight="700"
          font-size="22" letter-spacing="2" fill="#fff">VOCAB · TERRA</text>
    <rect x="40" y="162" width="240" height="48" rx="4" fill="url(#bookC)"/>
    <text x="60" y="194"
          font-family="'Bebas Neue','Arial',sans-serif" font-weight="700"
          font-size="22" letter-spacing="2" fill="#fff">VOCAB · SATURN</text>
    <rect x="60" y="108" width="220" height="48" rx="4" fill="#F472B6"/>
    <text x="80" y="140"
          font-family="'Bebas Neue','Arial',sans-serif" font-weight="700"
          font-size="20" letter-spacing="2" fill="#fff">PAST PAPERS</text>
  </g>

  <!-- Eyebrow -->
  <text x="540" y="200"
        font-family="'Noto Sans KR','Arial',sans-serif" font-weight="700"
        font-size="20" letter-spacing="6" fill="#FBBF24">✦ MARKET</text>

  <!-- Title -->
  <text x="540" y="296"
        font-family="'Bebas Neue','Arial Black',sans-serif" font-weight="700"
        font-size="80" letter-spacing="4" fill="url(#title)">MARKET</text>

  <text x="540" y="356"
        font-family="'Noto Sans KR','Arial',sans-serif" font-weight="800"
        font-size="30" fill="#F0F0F0">단어장 · 기출 문제집</text>
  <text x="540" y="392"
        font-family="'Noto Sans KR','Arial',sans-serif" font-weight="500"
        font-size="20" fill="rgba(240,240,240,.7)">레벨별 추가 학습 자료를 단권으로 구매</text>

  <!-- CTA pill -->
  <g transform="translate(540,432)">
    <rect width="280" height="56" rx="28" fill="#FBBF24"/>
    <text x="140" y="38" text-anchor="middle"
          font-family="'Noto Sans KR','Arial',sans-serif" font-weight="900"
          font-size="20" fill="#0A0A14">마켓 둘러보기 →</text>
  </g>

  <!-- Domain -->
  <text x="540" y="572"
        font-family="'Noto Sans KR','Arial',sans-serif" font-weight="600"
        font-size="18" letter-spacing="4" fill="rgba(180,180,220,.55)">terra-nova.kr/market</text>
</svg>
