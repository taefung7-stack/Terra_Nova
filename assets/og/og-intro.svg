<?xml version="1.0" encoding="UTF-8"?>
<!-- OG cover for intro.html (1200×630) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Terra Nova 회사소개 OG 커버">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0B0A2E"/>
      <stop offset="55%"  stop-color="#0A0A14"/>
      <stop offset="100%" stop-color="#050512"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#A78BFA"/>
      <stop offset="60%"  stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="rgba(56,189,248,.18)"/>
      <stop offset="100%" stop-color="rgba(56,189,248,0)"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g fill="#fff" opacity=".4">
    <circle cx="120" cy="80" r="1.2"/><circle cx="320" cy="60" r="1.4"/>
    <circle cx="600" cy="40" r="1"/><circle cx="900" cy="80" r="1.2"/>
    <circle cx="1080" cy="60" r="1.4"/><circle cx="200" cy="560" r="1.2"/>
    <circle cx="800" cy="580" r="1.2"/><circle cx="1100" cy="500" r="1.4"/>
  </g>

  <!-- Right: planet illustration (simplified) -->
  <g transform="translate(940,315)">
    <circle cx="0" cy="0" r="160" fill="#1e1b4b" stroke="rgba(167,139,250,.45)" stroke-width="1.4"/>
    <circle cx="-30" cy="-40" r="22" fill="rgba(255,255,255,.06)"/>
    <circle cx="40" cy="20" r="36" fill="rgba(255,255,255,.04)"/>
    <circle cx="-50" cy="50" r="14" fill="rgba(255,255,255,.05)"/>
    <ellipse cx="0" cy="0" rx="220" ry="36" fill="none" stroke="rgba(34,211,238,.5)" stroke-width="2" transform="rotate(-15)"/>
    <ellipse cx="0" cy="0" rx="220" ry="36" fill="none" stroke="rgba(167,139,250,.3)" stroke-width="1" transform="rotate(15)"/>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="170"
        font-family="'Noto Sans KR','Arial',sans-serif" font-weight="700"
        font-size="20" letter-spacing="6" fill="#22D3EE">✦ COMPANY</text>

  <!-- Title -->
  <text x="80" y="270"
        font-family="'Bebas Neue','Arial Black',sans-serif" font-weight="700"
        font-size="92" letter-spacing="4" fill="url(#title)">ABOUT US</text>

  <!-- Tagline -->
  <text x="80" y="340"
        font-family="'Noto Sans KR','Arial',sans-serif" font-weight="800"
        font-size="32" fill="#F0F0F0">새로운 영어교육의 표준</text>
  <text x="80" y="380"
        font-family="'Noto Sans KR','Arial',sans-serif" font-weight="500"
        font-size="20" fill="rgba(240,240,240,.7)">교과 연계 독해로 수능과 내신을 동시에</text>

  <!-- Stats -->
  <g transform="translate(80,440)">
    <text x="0" y="0"
          font-family="'Bebas Neue','Arial',sans-serif" font-weight="700"
          font-size="44" fill="#22D3EE">8</text>
    <text x="0" y="26"
          font-family="'Noto Sans KR','Arial',sans-serif" font-weight="500"
          font-size="14" fill="rgba(240,240,240,.6)">레벨</text>

    <text x="120" y="0"
          font-family="'Bebas Neue','Arial',sans-serif" font-weight="700"
          font-size="44" fill="#A78BFA">12</text>
    <text x="120" y="26"
          font-family="'Noto Sans KR','Arial',sans-serif" font-weight="500"
          font-size="14" fill="rgba(240,240,240,.6)">월간 신간</text>

    <text x="260" y="0"
          font-family="'Bebas Neue','Arial',sans-serif" font-weight="700"
          font-size="44" fill="#00FFA3">3</text>
    <text x="260" y="26"
          font-family="'Noto Sans KR','Arial',sans-serif" font-weight="500"
          font-size="14" fill="rgba(240,240,240,.6)">플랜</text>
  </g>

  <!-- Domain -->
  <text x="80" y="572"
        font-family="'Noto Sans KR','Arial',sans-serif" font-weight="600"
        font-size="18" letter-spacing="4" fill="rgba(180,180,220,.55)">terra-nova.kr</text>
</svg>
