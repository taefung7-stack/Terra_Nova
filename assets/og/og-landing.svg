<?xml version="1.0" encoding="UTF-8"?>
<!-- OG cover for landing.html (1200×630) — minimalist dark + mint -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Terra Nova English landing">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="60%">
      <stop offset="0%"  stop-color="rgba(0,255,163,.18)"/>
      <stop offset="60%" stop-color="rgba(0,255,163,.04)"/>
      <stop offset="100%" stop-color="rgba(0,255,163,0)"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0A0A0A"/>
  <rect width="1200" height="630" fill="url(#halo)"/>

  <g fill="#00FFA3" opacity=".22">
    <circle cx="180" cy="120" r="1.2"/>
    <circle cx="980" cy="100" r="1.5"/>
    <circle cx="240" cy="520" r="1.2"/>
    <circle cx="940" cy="540" r="1.4"/>
  </g>

  <!-- Hero -->
  <text x="600" y="290" text-anchor="middle"
        font-family="'Space Grotesk','Arial Black',sans-serif" font-weight="900"
        font-size="120" letter-spacing="14" fill="#FFFFFF">TERRA NOVA</text>
  <text x="600" y="336" text-anchor="middle"
        font-family="'Space Grotesk','Arial',sans-serif" font-weight="500"
        font-size="22" letter-spacing="22" fill="#00FFA3">ENGLISH</text>

  <!-- Single tagline -->
  <text x="600" y="416" text-anchor="middle"
        font-family="'Pretendard','Noto Sans KR','Arial',sans-serif" font-weight="800"
        font-size="34" fill="#F0F0F0">초5부터 N수생까지, 8단계 정밀 매칭</text>

  <line x1="540" y1="456" x2="660" y2="456" stroke="#00FFA3" stroke-width="2"/>

  <text x="600" y="510" text-anchor="middle"
        font-family="'Space Grotesk','Arial',sans-serif" font-weight="500"
        font-size="18" letter-spacing="6" fill="rgba(240,240,240,.5)">terra-nova.kr</text>
</svg>
