<?xml version="1.0" encoding="UTF-8"?>
<!-- OG cover for faq.html (1200×630) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Terra Nova FAQ OG 커버">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0B0A2E"/>
      <stop offset="55%"  stop-color="#0A0A14"/>
      <stop offset="100%" stop-color="#050512"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#34D399"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="rgba(34,211,238,.16)"/>
      <stop offset="100%" stop-color="rgba(34,211,238,0)"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g fill="#fff" opacity=".4">
    <circle cx="120" cy="80" r="1.2"/><circle cx="320" cy="60" r="1.4"/>
    <circle cx="900" cy="80" r="1.2"/><circle cx="1080" cy="60" r="1.4"/>
    <circle cx="200" cy="560" r="1.2"/><circle cx="1000" cy="540" r="1.4"/>
  </g>

  <!-- Big Q mark -->
  <g transform="translate(180,170)">
    <text x="0" y="220"
          font-family="'Bebas Neue','Arial Black',sans-serif" font-weight="700"
          font-size="320" fill="url(#title)" opacity=".9">?</text>
  </g>

  <!-- Eyebrow -->
  <text x="500" y="200"
        font-family="'Noto Sans KR','Arial',sans-serif" font-weight="700"
        font-size="20" letter-spacing="6" fill="#22D3EE">✦ HELP CENTER</text>

  <!-- Title -->
  <text x="500" y="290"
        font-family="'Bebas Neue','Arial Black',sans-serif" font-weight="700"
        font-size="92" letter-spacing="4" fill="#fff">FAQ</text>

  <text x="500" y="352"
        font-family="'Noto Sans KR','Arial',sans-serif" font-weight="800"
        font-size="34" fill="#F0F0F0">자주 묻는 질문</text>

  <!-- Topics -->
  <g transform="translate(500,400)">
    <rect width="120" height="36" rx="18" fill="rgba(34,211,238,.18)" stroke="rgba(34,211,238,.5)" stroke-width="1"/>
    <text x="60" y="24" text-anchor="middle"
          font-family="'Noto Sans KR','Arial',sans-serif" font-weight="700"
          font-size="14" fill="#22D3EE">구독 · 결제</text>

    <g transform="translate(140,0)">
      <rect width="120" height="36" rx="18" fill="rgba(167,139,250,.18)" stroke="rgba(167,139,250,.5)" stroke-width="1"/>
      <text x="60" y="24" text-anchor="middle"
            font-family="'Noto Sans KR','Arial',sans-serif" font-weight="700"
            font-size="14" fill="#A78BFA">교재 · 배송</text>
    </g>
    <g transform="translate(280,0)">
      <rect width="120" height="36" rx="18" fill="rgba(0,255,163,.18)" stroke="rgba(0,255,163,.5)" stroke-width="1"/>
      <text x="60" y="24" text-anchor="middle"
            font-family="'Noto Sans KR','Arial',sans-serif" font-weight="700"
            font-size="14" fill="#00FFA3">레벨 · 학습</text>
    </g>
    <g transform="translate(420,0)">
      <rect width="120" height="36" rx="18" fill="rgba(251,191,36,.18)" stroke="rgba(251,191,36,.5)" stroke-width="1"/>
      <text x="60" y="24" text-anchor="middle"
            font-family="'Noto Sans KR','Arial',sans-serif" font-weight="700"
            font-size="14" fill="#FBBF24">환불 · 해지</text>
    </g>
  </g>

  <!-- Domain -->
  <text x="500" y="572"
        font-family="'Noto Sans KR','Arial',sans-serif" font-weight="600"
        font-size="18" letter-spacing="4" fill="rgba(180,180,220,.55)">terra-nova.kr/faq</text>
</svg>
