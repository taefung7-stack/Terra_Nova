<?xml version="1.0" encoding="UTF-8"?>
<!-- OG cover for event.html (1200×630) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Terra Nova 이벤트 OG 커버">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1A0A2E"/>
      <stop offset="55%"  stop-color="#0A0A14"/>
      <stop offset="100%" stop-color="#050512"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FBBF24"/>
      <stop offset="50%"  stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%"  stop-color="rgba(244,114,182,.18)"/>
      <stop offset="100%" stop-color="rgba(244,114,182,0)"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g fill="#fff" opacity=".4">
    <circle cx="120" cy="80" r="1.2"/><circle cx="320" cy="60" r="1.4"/>
    <circle cx="600" cy="40" r="1"/><circle cx="900" cy="80" r="1.2"/>
    <circle cx="1080" cy="60" r="1.4"/><circle cx="200" cy="560" r="1.2"/>
    <circle cx="1000" cy="540" r="1.4"/>
  </g>

  <!-- Confetti -->
  <g opacity=".7">
    <rect x="180" y="160" width="14" height="6" rx="2" fill="#FBBF24" transform="rotate(20 187 163)"/>
    <rect x="280" y="220" width="12" height="6" rx="2" fill="#F472B6" transform="rotate(-15 286 223)"/>
    <rect x="950" y="180" width="14" height="6" rx="2" fill="#A78BFA" transform="rotate(35 957 183)"/>
    <rect x="1040" y="240" width="12" height="6" rx="2" fill="#22D3EE" transform="rotate(-25 1046 243)"/>
    <circle cx="220" cy="500" r="5" fill="#FBBF24"/>
    <circle cx="980" cy="480" r="6" fill="#F472B6"/>
  </g>

  <!-- Eyebrow -->
  <text x="600" y="130" text-anchor="middle"
        font-family="'Noto Sans KR','Arial',sans-serif" font-weight="700"
        font-size="20" letter-spacing="6" fill="#FBBF24">🎉 SPECIAL EVENT</text>

  <!-- Title -->
  <text x="600" y="240" text-anchor="middle"
        font-family="'Bebas Neue','Arial Black',sans-serif" font-weight="700"
        font-size="120" letter-spacing="6" fill="url(#title)">EVENTS</text>

  <!-- Korean tagline -->
  <text x="600" y="310" text-anchor="middle"
        font-family="'Noto Sans KR','Arial',sans-serif" font-weight="800"
        font-size="34" fill="#F0F0F0">신규 가입 첫 달 30% 할인</text>
  <text x="600" y="354" text-anchor="middle"
        font-family="'Noto Sans KR','Arial',sans-serif" font-weight="500"
        font-size="22" fill="rgba(240,240,240,.7)">론칭 기념 한정 쿠폰 + 친구 초대 리워드</text>

  <!-- CTA pill -->
  <g transform="translate(450,418)">
    <rect width="300" height="64" rx="32" fill="#F472B6"/>
    <text x="150" y="42" text-anchor="middle"
          font-family="'Noto Sans KR','Arial',sans-serif" font-weight="900"
          font-size="22" fill="#fff">쿠폰 받으러 가기 →</text>
  </g>

  <!-- Domain -->
  <text x="600" y="582" text-anchor="middle"
        font-family="'Noto Sans KR','Arial',sans-serif" font-weight="600"
        font-size="18" letter-spacing="4" fill="rgba(180,180,220,.55)">terra-nova.kr/event</text>
</svg>
