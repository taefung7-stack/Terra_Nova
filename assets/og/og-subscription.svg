<?xml version="1.0" encoding="UTF-8"?>
<!-- OG cover for subscription_detail_complete.html (1200×630) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Terra Nova 구독안내 OG 커버">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0B0A2E"/>
      <stop offset="55%"  stop-color="#0A0A14"/>
      <stop offset="100%" stop-color="#050512"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#A78BFA"/>
      <stop offset="60%"  stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(34,211,238,.18)"/>
      <stop offset="100%" stop-color="rgba(34,211,238,.04)"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(167,139,250,.22)"/>
      <stop offset="100%" stop-color="rgba(167,139,250,.06)"/>
    </linearGradient>
    <linearGradient id="cardC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,255,163,.20)"/>
      <stop offset="100%" stop-color="rgba(0,255,163,.04)"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%"  stop-color="rgba(56,189,248,.18)"/>
      <stop offset="100%" stop-color="rgba(56,189,248,0)"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g fill="#fff" opacity=".4">
    <circle cx="120" cy="80" r="1.2"/><circle cx="320" cy="60" r="1"/>
    <circle cx="600" cy="50" r="1.4"/><circle cx="900" cy="80" r="1.2"/>
    <circle cx="1080" cy="60" r="1"/><circle cx="200" cy="560" r="1.2"/>
    <circle cx="1000" cy="540" r="1.4"/>
  </g>

  <!-- Eyebrow -->
  <text x="600" y="100" text-anchor="middle"
        font-family="'Noto Sans KR','Arial',sans-serif" font-weight="700"
        font-size="20" letter-spacing="6" fill="#22D3EE">✦ SUBSCRIPTION PLANS</text>

  <!-- Title -->
  <text x="600" y="180" text-anchor="middle"
        font-family="'Bebas Neue','Arial Black',sans-serif" font-weight="700"
        font-size="80" letter-spacing="3" fill="url(#title)">3 PLANS · 8 LEVELS</text>

  <!-- Subtitle -->
  <text x="600" y="225" text-anchor="middle"
        font-family="'Noto Sans KR','Arial',sans-serif" font-weight="500"
        font-size="22" fill="rgba(240,240,240,.78)">레벨에 정확히 맞는 월간 학습지 구독</text>

  <!-- 3 plan cards -->
  <g transform="translate(160,290)">
    <!-- LIGHT -->
    <g>
      <rect width="260" height="240" rx="20" fill="url(#cardA)" stroke="rgba(34,211,238,.45)" stroke-width="1.4"/>
      <text x="130" y="56" text-anchor="middle"
            font-family="'Bebas Neue','Arial',sans-serif" font-weight="700"
