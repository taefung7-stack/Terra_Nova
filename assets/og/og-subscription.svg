      <text x="130" y="172" text-anchor="middle"
            font-family="'Noto Sans KR','Arial',sans-serif" font-weight="400"
            font-size="14" fill="rgba(240,240,240,.55)">원 / 월</text>
      <text x="130" y="210" text-anchor="middle"
            font-family="'Noto Sans KR','Arial',sans-serif" font-weight="600"
            font-size="13" fill="rgba(240,240,240,.7)">월 12권 PDF · 즉시 다운로드</text>
    </g>
    <!-- STANDARD -->
    <g transform="translate(310,-12)">
      <rect width="260" height="264" rx="20" fill="url(#cardB)" stroke="rgba(167,139,250,.6)" stroke-width="2"/>
      <rect x="80" y="-14" width="100" height="28" rx="14" fill="#A78BFA"/>
      <text x="130" y="6" text-anchor="middle"
            font-family="'Noto Sans KR','Arial',sans-serif" font-weight="900"
            font-size="13" fill="#0A0A14">BEST</text>
      <text x="130" y="68" text-anchor="middle"
            font-family="'Bebas Neue','Arial',sans-serif" font-weight="700"
            font-size="36" letter-spacing="3" fill="#A78BFA">STANDARD</text>
      <text x="130" y="94" text-anchor="middle"
            font-family="'Noto Sans KR','Arial',sans-serif" font-weight="500"
            font-size="14" fill="rgba(240,240,240,.6)">실물 교재 + PDF</text>
      <text x="130" y="160" text-anchor="middle"
            font-family="'Bebas Neue','Arial',sans-serif" font-weight="700"
            font-size="48" fill="#fff">24,900</text>
      <text x="130" y="184" text-anchor="middle"
            font-family="'Noto Sans KR','Arial',sans-serif" font-weight="400"
            font-size="14" fill="rgba(240,240,240,.55)">원 / 월</text>
      <text x="130" y="222" text-anchor="middle"
            font-family="'Noto Sans KR','Arial',sans-serif" font-weight="600"
            font-size="13" fill="rgba(240,240,240,.7)">실물 교재 매월 배송</text>
    </g>
    <!-- PREMIUM -->
    <g transform="translate(620,0)">
      <rect width="260" height="240" rx="20" fill="url(#cardC)" stroke="rgba(0,255,163,.45)" stroke-width="1.4"/>
      <text x="130" y="56" text-anchor="middle"
            font-family="'Bebas Neue','Arial',sans-serif" font-weight="700"
            font-size="36" letter-spacing="3" fill="#00FFA3">PREMIUM</text>
      <text x="130" y="82" text-anchor="middle"
            font-family="'Noto Sans KR','Arial',sans-serif" font-weight="500"
            font-size="14" fill="rgba(240,240,240,.6)">해설 강의 포함</text>
      <text x="130" y="148" text-anchor="middle"
            font-family="'Bebas Neue','Arial',sans-serif" font-weight="700"
            font-size="48" fill="#fff">58,900</text>
      <text x="130" y="172" text-anchor="middle"
            font-family="'Noto Sans KR','Arial',sans-serif" font-weight="400"
            font-size="14" fill="rgba(240,240,240,.55)">원 / 월</text>
      <text x="130" y="210" text-anchor="middle"
            font-family="'Noto Sans KR','Arial',sans-serif" font-weight="600"
            font-size="13" fill="rgba(240,240,240,.7)">1:1 첨삭 · 월간 LIVE</text>
    </g>
  </g>

  <!-- Domain -->
  <text x="600" y="600" text-anchor="middle"
        font-family="'Noto Sans KR','Arial',sans-serif" font-weight="600"
        font-size="18" letter-spacing="4" fill="rgba(180,180,220,.55)">terra-nova.kr</text>
</svg>
