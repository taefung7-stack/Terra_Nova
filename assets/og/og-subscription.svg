<?xml version="1.0" encoding="UTF-8"?>
<!-- OG cover for subscription_detail_complete.html (1200×630) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Terra Nova subscription">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="60%">
      <stop offset="0%"  stop-color="rgba(0,255,163,.16)"/>
      <stop offset="60%" stop-color="rgba(0,255,163,.04)"/>
      <stop offset="100%" stop-color="rgba(0,255,163,0)"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0A0A0A"/>
  <rect width="1200" height="630" fill="url(#halo)"/>

  <g fill="#00FFA3" opacity=".22">
    <circle cx="180" cy="120" r="1.2"/>
    <circle cx="980" cy="100" r="1.5"/>
    <circle cx="940" cy="540" r="1.4"/>
  </g>

  <!-- Brand small -->
  <text x="600" y="120" text-anchor="middle"
        font-family="'Space Grotesk','Arial',sans-serif" font-weight="700"
        font-size="14" letter-spacing="7" fill="#00FFA3">TERRA NOVA · ENGLISH</text>

  <!-- Hero number -->
  <text x="600" y="290" text-anchor="middle"
        font-family="'Space Grotesk','Arial Black',sans-serif" font-weight="900"
        font-size="160" letter-spacing="2" fill="#FFFFFF">월 11,900원</text>

  <text x="600" y="350" text-anchor="middle"
        font-family="'Pretendard','Noto Sans KR','Arial',sans-serif" font-weight="600"
        font-size="22" fill="rgba(240,240,240,.55)">부터 시작</text>

  <!-- Tagline -->
  <text x="600" y="430" text-anchor="middle"
        font-family="'Pretendard','Noto Sans KR','Arial',sans-serif" font-weight="800"
        font-size="34" fill="#F0F0F0">3 PLANS · 8 LEVELS · 12 ISSUES</text>

  <line x1="540" y1="470" x2="660" y2="470" stroke="#00FFA3" stroke-width="2"/>

  <text x="600" y="524" text-anchor="middle"
        font-family="'Space Grotesk','Arial',sans-serif" font-weight="500"
        font-size="18" letter-spacing="6" fill="rgba(240,240,240,.5)">terra-nova.kr</text>
</svg>
